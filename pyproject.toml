[project]
name = "aha"
version = "0.1.0"
description = "An agent fabric for supervised data and analytics engineering tasks"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Matheus Buniotto", email = "matheus.buniotto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=2.46.0",
    "pydantic-ai-harness>=0.32.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dbt = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
]
# Only the read-only query path. `dbt-databricks` pins an older dbt-core, so it
# belongs in the environment that runs dbt, not in ours.
databricks = [
    "databricks-sql-connector>=4.2.1",
]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
aha = "aha.cli:app"

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['slow: shells out to dbt and touches a real DuckDB warehouse']
filterwarnings = [
    # The scripted test model has no pricing data; the ceiling is still asserted in policy tests.
    'ignore::pydantic_ai.usage.CostNotFoundWarning',
]

[tool.ruff]
line-length = 120
src = ['src', 'tests']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM', 'RUF']

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['E501']
